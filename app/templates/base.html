<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Social Media AI Agency{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      🤖 Prodigal Multi-Agent AI
      <span class="brand-badge">Local Ollama</span>
    </a>
    <ul class="nav-links">
      <li><a href="/" class="{% if active_tab == 'dashboard' %}active{% endif %}">Dashboard</a></li>
      <li><a href="/platform" class="{% if active_tab == 'platform' %}active{% endif %}">Mock Platform</a></li>
      <li><a href="/trace" class="{% if active_tab == 'trace' %}active{% endif %}">Agent Trace Log</a></li>
      <li><a href="/analytics" class="{% if active_tab == 'analytics' %}active{% endif %}">Analytics & Comparison</a></li>
    </ul>
    <div id="ollamaStatus" class="status-indicator">
      <span class="status-dot"></span> Checking Ollama...
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Prodigal AI Intern Task 1 — Multi-Agent Social Media AI Company | Powered by Local Ollama (gemma3:4b) & SQLite</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkOllamaStatus();
      setupEventListeners();
    });

    async function checkOllamaStatus() {
      const statusEl = document.getElementById('ollamaStatus');
      if (!statusEl) return;

      try {
        const res = await fetch('/api/agents/status');
        const text = await res.text();
        let data = {};
        try { data = JSON.parse(text); } catch (e) {}
        
        if (data.status === 'ok') {
          statusEl.innerHTML = `<span class="status-dot"></span> Ollama: ${data.target_model} (Online)`;
          statusEl.className = 'status-indicator';
        } else {
          statusEl.innerHTML = `<span class="status-dot" style="background:#ef4444;box-shadow:0 0 8px #ef4444;"></span> Ollama: ${data.message || 'Offline'}`;
          statusEl.className = 'status-indicator';
          statusEl.style.borderColor = 'rgba(239, 68, 68, 0.3)';
          statusEl.style.color = '#ef4444';
        }
      } catch (err) {
        statusEl.innerHTML = `<span class="status-dot" style="background:#ef4444;"></span> Ollama Offline`;
      }
    }

    function setupEventListeners() {
      const openModalBtn = document.getElementById('openCreateModal');
      const closeModalBtn = document.getElementById('closeCreateModal');
      const modal = document.getElementById('createModal');
      const form = document.getElementById('createCampaignForm');

      if (openModalBtn && modal) {
        openModalBtn.addEventListener('click', () => modal.classList.add('active'));
      }
      if (closeModalBtn && modal) {
        closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
      }

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const title = document.getElementById('campaignTitle').value;
          const brief = document.getElementById('humanBrief').value;

          try {
            const res = await fetch('/api/campaigns', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title, human_brief: brief })
            });
            const text = await res.text();
            let data = {};
            try { data = JSON.parse(text); } catch (e) {}
            
            if (data.status === 'success' && data.campaign_id) {
              window.location.href = `/campaign/${data.campaign_id}`;
            } else {
              window.location.reload();
            }
          } catch (err) {
            alert('Notice: ' + err.message);
          }
        });
      }
    }

    async function triggerPipeline(campaignId, action) {
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = '🤖 Agents Executing Pipeline...';
      btn.disabled = true;

      try {
        let endpoint = `/api/campaigns/${campaignId}/run-week1`;
        if (action === 'approve') endpoint = `/api/campaigns/${campaignId}/approve-campaign`;
        if (action === 'publish_w1') endpoint = `/api/campaigns/${campaignId}/publish-week?week_number=1`;
        if (action === 'run_w2') endpoint = `/api/campaigns/${campaignId}/run-week2`;
        if (action === 'publish_w2') endpoint = `/api/campaigns/${campaignId}/publish-week?week_number=2`;

        const res = await fetch(endpoint, { method: 'POST' });
        await res.text();

        // Immediate page reload for actions that are non-background
        if (action === 'approve' || action === 'publish_w1' || action === 'publish_w2') {
          window.location.reload();
          return;
        }

        // For background pipeline execution (run_w1, run_w2), poll status until posts are generated
        let checkAttempts = 0;
        const pollInterval = setInterval(async () => {
          checkAttempts++;
          try {
            const statusRes = await fetch(`/api/campaigns/${campaignId}`);
            const text = await statusRes.text();
            const data = JSON.parse(text);
            
            if (data.posts && data.posts.length > 0 && (data.status === 'HUMAN_REVIEW' || data.status === 'APPROVED')) {
              clearInterval(pollInterval);
              window.location.reload();
            }
          } catch (e) {}

          if (checkAttempts >= 30) {
            clearInterval(pollInterval);
            window.location.reload();
          }
        }, 3000);

      } catch (err) {
        alert('Notice: ' + err.message);
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

    async function approvePost(postId, action) {
      try {
        const res = await fetch(`/api/posts/${postId}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: action })
        });
        await res.text();
        window.location.reload();
      } catch (err) {
        alert('Notice: ' + err.message);
      }
    }
  </script>
</body>
</html>
